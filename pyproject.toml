[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudlab-cli"
version = "0.1.0"
description = "A focused command-line client for CloudLab experiment management"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yiming Su" }]
dependencies = [
    "httpx>=0.27,<1",
    "typing-extensions>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
binary = [
    "pyinstaller>=6.21,<7",
]

[project.scripts]
cloudlab = "cloudlab_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudlab_cli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
