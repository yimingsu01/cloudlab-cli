name: Standalone binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: cloudlab-linux-x86_64
            extension: ""
          - os: ubuntu-22.04-arm
            asset: cloudlab-linux-arm64
            extension: ""
          - os: windows-2025
            asset: cloudlab-windows-x86_64
            extension: .exe
          - os: macos-15-intel
            asset: cloudlab-macos-x86_64
            extension: ""
          - os: macos-15
            asset: cloudlab-macos-arm64
            extension: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install binary build dependencies
        run: python -m pip install ".[binary]"

      - name: Build one-file executable
        run: >-
          python scripts/build_binary.py
          --output-name ${{ matrix.asset }}

      - name: Smoke test executable
        shell: bash
        run: ./dist/${{ matrix.asset }}${{ matrix.extension }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-artifacts/*
          --verify-tag
          --generate-notes
